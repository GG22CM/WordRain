<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字雨 3D · Text Rain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23000'/%3E%3Cpath d='M8 4l1.6 3H13l-3.6 1.4L10.6 11 6 8.6l2.3 4.6L6 13l4-6.5L11.5 4z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    /* 极光星夜背景（3D 层透明叠加其上） */
    background:
      radial-gradient(140% 100% at 50% -12%, #12204a 0%, #0a1030 30%, #05070f 66%, #000 100%);
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(55% 38% at 28% 0%, rgba(120,200,185,.16), transparent 62%),
      radial-gradient(48% 32% at 72% 6%, rgba(135,155,255,.14), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* 3D WebGL 层 */
  #gl {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    pointer-events: none;
    z-index: 0;
  }

  /* 前景：输入框 */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 5vw;
  }
  textarea#editor {
    width: min(1100px, 92vw);
    height: 58vh;
    min-height: 240px;
    resize: none;
    overflow-y: auto;
    scrollbar-width: none;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    caret-color: #cfe8ff;
    text-shadow: 0 0 10px rgba(160,205,255,.35);
    font-family: inherit;
    font-size: 26px;
    line-height: 2;
    text-align: left;
    padding: 18px 20px;
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 5px rgba(155,205,255,.25), 0 0 12px rgba(150,200,255,.14); }
    50%      { text-shadow: 0 0 11px rgba(170,215,255,.55), 0 0 26px rgba(160,205,255,.32); }
  }
  textarea#editor::-webkit-scrollbar { display: none; }
  textarea#editor::placeholder {
    color: rgba(200,220,255,.26);
    text-shadow: none;
    animation: none;
  }
  textarea#editor:focus { outline: none; box-shadow: none; border: none; }
  @media (prefers-reduced-motion: reduce) {
    textarea#editor { animation: none; }
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%) translateY(8px);
    color: #fff;
    background: rgba(120,170,235,.12);
    border: 1px solid rgba(150,205,255,.28);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 2;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hint {
    position: fixed;
    left: 16px;
    bottom: 14px;
    z-index: 1;
    font-size: 12px;
    letter-spacing: .08em;
    color: rgba(190,215,255,.35);
    pointer-events: none;
  }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./three/three.module.js",
    "three/addons/": "./three/addons/"
  }
}
</script>
</head>
<body>
  <div id="gl"></div>

  <main class="stage">
    <textarea id="editor" spellcheck="false" autocomplete="off"
      placeholder="输入文字，它会化作雨滴落下……"></textarea>
  </main>

  <div id="toast" role="status"></div>
  <div class="hint" aria-hidden="true">输入文字 → 化作雨滴落下 · Ctrl+S 保存为 .txt</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

(function () {
  "use strict";

  var editor = document.getElementById('editor');
  var toast = document.getElementById('toast');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  /* ===== 场景 / 渲染 ===== */
  var container = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.0 : 1.25));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.domElement.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none;z-index:0;';
  container.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070f);
  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 20, 20);        // 适中俯角：波纹可见，且修复后形状恒定（视角决定的椭圆）
  camera.lookAt(0, 1.6, 0);

  /* 光：柔和环境光让水面/雨滴有基础可见度 */
  var hemi = new THREE.HemisphereLight(0xbfe0ff, 0x0a1030, 1.0);
  scene.add(hemi);
  var light = new THREE.DirectionalLight(0xffffff, 0.6);
  light.position.set(3, 8, 6);
  scene.add(light);

  /* ===== 水面星河倒影（Points + 星云）：全部星星作为水面倒影，循环流动、永不消失，空中无星星 ===== */
  var REFL_DRIFT = 2.2;   // 倒影横向漂移速度（单位/秒）
  function buildReflection(count, size, color, opacity) {
    var pos = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 88;      // x：水面横向范围
      pos[i * 3 + 1] = -0.6 - Math.random() * 5;    // y：紧贴水面下方（浅，像水面的倒影）
      pos[i * 3 + 2] = -4 - Math.random() * 16;     // z：水面纵深
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({
      color: color, size: size, transparent: true, opacity: opacity,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    return new THREE.Points(g, m);
  }
  // 倒影横向循环漂移：所有点向右缓慢流动，超出水面右缘回绕到左缘 → 星河在水面持续流动、永不消失
  function driftReflection(pts, dt) {
    var arr = pts.geometry.attributes.position.array;
    for (var i = 0; i < arr.length; i += 3) {
      arr[i] += REFL_DRIFT * dt;
      if (arr[i] > 44) arr[i] -= 88;   // 回绕（右→左）
      else if (arr[i] < -44) arr[i] += 88;
    }
    pts.geometry.attributes.position.needsUpdate = true;
  }
  var reflection = buildReflection(isMobile ? 700 : 900, 0.5, 0xbfd6ff, 0.75);
  var brightReflection = buildReflection(130, 0.95, 0xe8f1ff, 0.85);
  scene.add(reflection);
  scene.add(brightReflection);

  /* ===== 文字雨滴 Sprite 系统 ===== */
  var texCache = new Map();
  function getTexture(ch) {
    if (texCache.has(ch)) return texCache.get(ch);
    var s = 128;
    var cv = document.createElement('canvas');
    cv.width = s; cv.height = s;
    var c2d = cv.getContext('2d');
    c2d.clearRect(0, 0, s, s);
    c2d.fillStyle = '#ffffff';
    c2d.font = '82px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
    c2d.textAlign = 'center';
    c2d.textBaseline = 'middle';
    c2d.fillText(ch, s / 2, s / 2 + 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    texCache.set(ch, tex);
    return tex;
  }

  var MAX_DROPS = isMobile ? 100 : 160;
  var GHOST_MAX = isMobile ? 80 : 100;
  var drops = [];
  var ghosts = [];

  function Drop(ch) {
    this.ch = ch;
    this.x = rand(-14, 14);
    this.z = rand(-11, 8);                 // 纵深：远(-) 到 近(+)，落点有足够扩散空间
    this.y = rand(9, 13.5);
    this.vy = rand(2.5, 6.5);
    this.gravity = rand(9, 14);
    this.opacity = rand(0.8, 1);
    this.trail = [];
    this.nextGhost = 0;
    this.texture = getTexture(ch);
    var mat = new THREE.SpriteMaterial({
      map: this.texture, transparent: true,
      opacity: this.opacity, depthWrite: false,
      blending: THREE.NormalBlending
    });
    this.sprite = new THREE.Sprite(mat);
    this.sprite.scale.set(1.25, 1.25, 1);
    this.sprite.position.set(this.x, this.y, this.z);
    scene.add(this.sprite);
  }

  function spawnLine(text) {
    var chars = Array.from(text);
    for (var i = 0; i < chars.length; i++) {
      var c = chars[i];
      if (/\s/.test(c)) continue;          // 空白字符不触发
      if (drops.length >= MAX_DROPS) { killDrop(drops.shift()); }
      drops.push(new Drop(c));
    }
  }

  function killDrop(d) {
    removeSprite(d.sprite);
    for (var i = 0; i < d.trail.length; i++) removeSprite(d.trail[i].sprite);
    d.trail.length = 0;
  }

  function addGhost(d, t) {
    if (ghosts.length >= GHOST_MAX) return;
    var gm = new THREE.SpriteMaterial({
      map: d.texture, transparent: true, opacity: 0.0,
      depthWrite: false, blending: THREE.AdditiveBlending, color: 0xa9c9f0
    });
    var gs = new THREE.Sprite(gm);
    gs.scale.set(1.05, 1.05, 1);
    gs.position.set(d.x, d.y, d.z);
    scene.add(gs);
    var g = { sprite: gs, born: t, base: d.opacity * 0.5, life: 0.5 };
    d.trail.push(g);
    ghosts.push(g);
    if (d.trail.length > 3) { removeSprite(d.trail.shift().sprite); }
  }

  function removeSprite(sp) {
    scene.remove(sp);
    if (sp.material) sp.material.dispose();
  }

  /* ===== 涟漪：细线圆环（Line 环，线条宽度恒定不随半径变宽，符合"扩散变细变暗"） ===== */
  var lineUnitGeo = new THREE.BufferGeometry().setFromPoints(function () {
    var pts = [];
    for (var k = 0; k < 96; k++) { var a = (k / 96) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a), 0, Math.sin(a))); }
    return pts;
  }());                       // 单位圆(半径1)在 XZ 平面

  var ripples = [];                 // 活跃涟漪（线条）

  function addRipple(d) {
    // 水滴"大小"按纵深映射：近处(z大)=大滴 → 波峰环数多、波纹带更大
    var sf = THREE.MathUtils.clamp((d.z + 11) / 19, 0, 1);
    var rings = 1 + Math.round(sf * 2);         // 波峰环数：小滴 1，大滴最多 3（间距清晰不黏）
    var wavelength = 4.5;                        // 波峰间距大：环与环之间有明显波谷空隙
    var targetR = 8 + sf * 22;                   // 波纹带目标外沿半径（大，扩散得远）
    var boundary = Math.min(48 - Math.abs(d.x), 20 - Math.abs(d.z)); // 到水面边界距离
    var maxR = Math.min(targetR, boundary);      // 外沿最大半径（到边界即消散）
    var speed = rand(1.6, 2.6);                  // 外扩速度慢：波纹从中心缓慢扩散，过程清晰可见
    if (ripples.length > 48) removeRipple(0);    // 限制波纹数量，防堆积
    var r = { age: 0, x: d.x, z: d.z, radius: 0, speed: speed, wavelength: wavelength, rings: rings, maxR: maxR, loops: [] };
    for (var i = 0; i < rings; i++) {
      var mat = new THREE.LineBasicMaterial({
        color: 0x9fc9ff, transparent: true, opacity: 0,
        depthWrite: false
      });
      var loop = new THREE.LineLoop(lineUnitGeo, mat);   // 细线圆环：宽度恒定，仅半径随 scale 放大
      loop.position.set(d.x, 0.02, d.z);
      loop.scale.set(0.01, 1, 0.01);   // 线在 XZ 平面：缩放 x 与 z，正圆等比扩散（线条宽度不变）
      loop.visible = false;
      scene.add(loop);
      r.loops.push(loop);
    }
    ripples.push(r);
  }

  function updateRipples(dt) {
    for (var i = ripples.length - 1; i >= 0; i--) {
      var r = ripples[i];
      r.age += dt;
      r.radius += r.speed * dt;                  // 波纹带外沿整体向外推进
      for (var j = 0; j < r.loops.length; j++) {
        var rr = r.radius - j * r.wavelength;    // 第 j 个波峰环半径（j=0 为最外波峰）
        if (rr <= 0.3) { r.loops[j].visible = false; continue; } // 该波峰尚未展开
        r.loops[j].visible = true;
        r.loops[j].scale.set(rr, 1, rr);   // 修正：缩放 x 与 z（y 恒 0），正圆等比扩散，投影恒定椭圆
        // 能量随传播衰减：刚落到水面(radius 小)最亮，扩散越远越暗，到边界降为 0 —— 越扩散越暗
        var decay = 1 - Math.min(r.radius / r.maxR, 1);
        // 外圈(扩散前沿)略亮、内圈稍暗，保持波浪向外推进感（差异轻微，不掩盖整体衰减）
        var falloff = 1 - 0.35 * (j / Math.max(1, r.loops.length - 1));
        r.loops[j].material.opacity = Math.max(0, 0.5 * decay * falloff);
      }
      if (r.radius >= r.maxR) removeRipple(i);   // 外沿到边界/目标 → 整组消散
    }
  }

  function removeRipple(idx) {
    var r = ripples[idx];
    for (var i = 0; i < r.loops.length; i++) {
      scene.remove(r.loops[i]);
      if (r.loops[i].material) r.loops[i].material.dispose();
    }
    ripples.splice(idx, 1);
  }

  /* ===== Bloom 后处理 ===== */
  var composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  var bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    isMobile ? 0.15 : 0.22,  // strength（调低：只做柔和的辉光晕染，不再整屏发亮）
    0.5,                       // radius
    0.5                        // threshold（提高：仅最亮的文字雨滴轻微发光，波纹/星星不触发）
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ===== 时间 / 动画循环 ===== */
  var clock = new THREE.Clock();
  function frame() {
    var dt = clock.getDelta();
    var t = clock.elapsedTime;

    // 水面星河倒影：横向循环漂移（超出水面回绕到另一侧），始终存在、流动不息
    driftReflection(reflection, dt);
    driftReflection(brightReflection, dt);

    // 涟漪线条更新
    updateRipples(dt);

    // 雨滴更新
    for (var j = drops.length - 1; j >= 0; j--) {
      var d = drops[j];
      d.vy += d.gravity * dt;              // 重力加速
      d.y -= d.vy * dt;
      if (d.y <= 0) {                       // 没入水面：按水滴大小泛起波纹带并消失
        addRipple(d);
        killDrop(d);
        drops.splice(j, 1);
        continue;
      }
      d.sprite.position.set(d.x, d.y, d.z);

      // 残影拖尾采样（降频以省 draw call）
      if (t - d.nextGhost > 0.09) {
        d.nextGhost = t;
        addGhost(d, t);
      }
    }

    // 残影 ghost 衰减
    for (var k = ghosts.length - 1; k >= 0; k--) {
      var g = ghosts[k];
      var age = (t - g.born) / g.life;
      if (age >= 1) {
        removeSprite(g.sprite);
        ghosts.splice(k, 1);
      } else {
        g.sprite.material.opacity = g.base * (1 - age);
      }
    }

    composer.render();
    if (!reduceMotion) requestAnimationFrame(frame);
  }

  if (reduceMotion) {
    composer.render();   // 减少动态：只渲染一帧静态（星空可见）
  } else {
    requestAnimationFrame(frame);
  }

  /* ===== 工具 ===== */
  function rand(min, max) { return min + Math.random() * (max - min); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function timestamp() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }
  function saveToTxt() {
    var text = editor.value;
    if (!text.trim()) { showToast('输入为空，先写点字再保存'); return; }
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '文字雨_' + timestamp() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast('已保存：' + a.download);
  }

  /* ===== 交互：输入即触发（中英文） + Ctrl+S 保存 ===== */
  editor.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      saveToTxt();
    }
  });

  var lastValue = editor.value;
  editor.addEventListener('compositionend', function () {
    var v = editor.value;
    if (!reduceMotion && v.length > lastValue.length) spawnLine(v.slice(lastValue.length));
    lastValue = v;
  });
  editor.addEventListener('input', function (e) {
    if (e.isComposing) return;             // 拼音编辑中：跳过，不更新基准值
    var data = e.data;
    if (!reduceMotion && data) spawnLine(data);
    lastValue = editor.value;
  });
})();
</script>
</body>
</html>
