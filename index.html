<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字雨 3D · Text Rain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23000'/%3E%3Cpath d='M8 4l1.6 3H13l-3.6 1.4L10.6 11 6 8.6l2.3 4.6L6 13l4-6.5L11.5 4z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    /* 极光星夜背景（3D 层透明叠加其上） */
    background:
      radial-gradient(140% 100% at 50% -12%, #12204a 0%, #0a1030 30%, #05070f 66%, #000 100%);
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(55% 38% at 28% 0%, rgba(120,200,185,.16), transparent 62%),
      radial-gradient(48% 32% at 72% 6%, rgba(135,155,255,.14), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* 3D WebGL 层 */
  #gl {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    pointer-events: none;
    z-index: 0;
  }

  /* 前景：输入框 */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 5vw;
  }
  textarea#editor {
    width: min(1100px, 92vw);
    height: 58vh;
    min-height: 240px;
    resize: none;
    overflow-y: auto;
    scrollbar-width: none;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    caret-color: #cfe8ff;
    text-shadow: 0 0 10px rgba(160,205,255,.35);
    font-family: inherit;
    font-size: 26px;
    line-height: 2;
    text-align: left;
    padding: 18px 20px;
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 5px rgba(155,205,255,.25), 0 0 12px rgba(150,200,255,.14); }
    50%      { text-shadow: 0 0 11px rgba(170,215,255,.55), 0 0 26px rgba(160,205,255,.32); }
  }
  textarea#editor::-webkit-scrollbar { display: none; }
  textarea#editor::placeholder {
    color: rgba(200,220,255,.26);
    text-shadow: none;
    animation: none;
  }
  textarea#editor:focus { outline: none; box-shadow: none; border: none; }
  @media (prefers-reduced-motion: reduce) {
    textarea#editor { animation: none; }
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%) translateY(8px);
    color: #fff;
    background: rgba(120,170,235,.12);
    border: 1px solid rgba(150,205,255,.28);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 2;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hint {
    position: fixed;
    left: 16px;
    bottom: 14px;
    z-index: 1;
    font-size: 12px;
    letter-spacing: .08em;
    color: rgba(190,215,255,.35);
    pointer-events: none;
  }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./three/three.module.js",
    "three/addons/": "./three/addons/"
  }
}
</script>
</head>
<body>
  <div id="gl"></div>

  <main class="stage">
    <textarea id="editor" spellcheck="false" autocomplete="off"
      placeholder="输入文字，它会化作雨滴落下……"></textarea>
  </main>

  <div id="toast" role="status"></div>
  <div class="hint" aria-hidden="true">输入文字 → 化作雨滴落下 · Ctrl+S 保存为 .txt</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

(function () {
  "use strict";

  var editor = document.getElementById('editor');
  var toast = document.getElementById('toast');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  /* ===== 场景 / 渲染 ===== */
  var container = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.0 : 1.25));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.domElement.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none;z-index:0;';
  container.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070f);
  var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 5.5, 15.5);
  camera.lookAt(0, 1.6, 0);

  /* 光：柔和环境光让水面/雨滴有基础可见度 */
  var hemi = new THREE.HemisphereLight(0xbfe0ff, 0x0a1030, 1.0);
  scene.add(hemi);
  var light = new THREE.DirectionalLight(0xffffff, 0.6);
  light.position.set(3, 8, 6);
  scene.add(light);

  /* ===== 星空（Points + 星云） ===== */
  function buildStars(count, size, color, opacity) {
    var pos = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 130;
      pos[i * 3 + 1] = (Math.random() - 0.3) * 70;
      pos[i * 3 + 2] = -60 - Math.random() * 90;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({
      color: color, size: size, transparent: true, opacity: opacity,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    return new THREE.Points(g, m);
  }
  var stars = buildStars(isMobile ? 800 : 1000, 0.32, 0xcfe4ff, 0.9);
  scene.add(stars);
  var brightStars = buildStars(120, 0.7, 0xe8f1ff, 0.9);
  scene.add(brightStars);

  /* 星空倒影：镜像一份星空到水面下方（y 取负），随主星空同步旋转 */
  function mirrorPoints(srcPoints, opacity) {
    var arr = srcPoints.geometry.attributes.position.array;
    var pos = new Float32Array(arr.length);
    for (var i = 0; i < arr.length; i += 3) {
      pos[i] = arr[i]; pos[i + 1] = -arr[i + 1]; pos[i + 2] = arr[i + 2];
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({
      color: 0xbfd6ff, size: srcPoints.material.size * 0.9,
      transparent: true, opacity: opacity,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    return new THREE.Points(g, m);
  }
  var starsMirror = mirrorPoints(stars, 0.30);
  var brightMirror = mirrorPoints(brightStars, 0.42);
  scene.add(starsMirror);
  scene.add(brightMirror);

  /* ===== 文字雨滴 Sprite 系统 ===== */
  var texCache = new Map();
  function getTexture(ch) {
    if (texCache.has(ch)) return texCache.get(ch);
    var s = 128;
    var cv = document.createElement('canvas');
    cv.width = s; cv.height = s;
    var c2d = cv.getContext('2d');
    c2d.clearRect(0, 0, s, s);
    c2d.fillStyle = '#ffffff';
    c2d.font = '82px "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif';
    c2d.textAlign = 'center';
    c2d.textBaseline = 'middle';
    c2d.fillText(ch, s / 2, s / 2 + 2);
    var tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    texCache.set(ch, tex);
    return tex;
  }

  var MAX_DROPS = isMobile ? 100 : 160;
  var GHOST_MAX = isMobile ? 80 : 100;
  var drops = [];
  var ghosts = [];
  var RIPPLE_MAX = 16;

  function Drop(ch) {
    this.ch = ch;
    this.x = rand(-14, 14);
    this.z = rand(-11, 8);                 // 纵深：远(-) 到 近(+)
    this.y = rand(9, 13.5);
    this.vy = rand(2.5, 6.5);
    this.gravity = rand(9, 14);
    this.opacity = rand(0.8, 1);
    this.trail = [];
    this.nextGhost = 0;
    this.texture = getTexture(ch);
    var mat = new THREE.SpriteMaterial({
      map: this.texture, transparent: true,
      opacity: this.opacity, depthWrite: false,
      blending: THREE.NormalBlending
    });
    this.sprite = new THREE.Sprite(mat);
    this.sprite.scale.set(1.25, 1.25, 1);
    this.sprite.position.set(this.x, this.y, this.z);
    scene.add(this.sprite);
  }

  function spawnLine(text) {
    var chars = Array.from(text);
    for (var i = 0; i < chars.length; i++) {
      var c = chars[i];
      if (/\s/.test(c)) continue;          // 空白字符不触发
      if (drops.length >= MAX_DROPS) { killDrop(drops.shift()); }
      drops.push(new Drop(c));
    }
  }

  function killDrop(d) {
    removeSprite(d.sprite);
    for (var i = 0; i < d.trail.length; i++) removeSprite(d.trail[i].sprite);
    d.trail.length = 0;
  }

  function addGhost(d, t) {
    if (ghosts.length >= GHOST_MAX) return;
    var gm = new THREE.SpriteMaterial({
      map: d.texture, transparent: true, opacity: 0.0,
      depthWrite: false, blending: THREE.AdditiveBlending, color: 0xa9c9f0
    });
    var gs = new THREE.Sprite(gm);
    gs.scale.set(1.05, 1.05, 1);
    gs.position.set(d.x, d.y, d.z);
    scene.add(gs);
    var g = { sprite: gs, born: t, base: d.opacity * 0.5, life: 0.5 };
    d.trail.push(g);
    ghosts.push(g);
    if (d.trail.length > 3) { removeSprite(d.trail.shift().sprite); }
  }

  function removeSprite(sp) {
    scene.remove(sp);
    if (sp.material) sp.material.dispose();
  }

  /* ===== 3D 水面：顶点扰动涟漪 Shader ===== */
  var RIPPLE_UNIFORMS = 16;
  var ripples = [];
  var uniformRipples = [];
  for (var ri = 0; ri < RIPPLE_UNIFORMS; ri++) uniformRipples.push(new THREE.Vector3(0, 0, -1000));

  var waterUniforms = {
    uTime: { value: 0 },
    uRipples: { value: uniformRipples },
    uRippleCount: { value: 0 }
  };

  var waterVert = /* glsl */`
    uniform float uTime;
    uniform vec3 uRipples[16];
    uniform int uRippleCount;
    varying float vDisp;
    void main() {
      vec3 pos = position;
      float disp = 0.0;
      for (int i = 0; i < 16; i++) {
        if (i >= uRippleCount) break;
        vec3 rp = uRipples[i];
        float t = uTime - rp.z;
        if (t <= 0.0 || t >= 1.4) continue;
        float d = distance(vec2(pos.x, pos.z), vec2(rp.x, rp.y));
        float rad = t * 8.0;
        float env = exp(-(d * d) / (rad * rad * 0.55));
        float wave = sin(rad * 2.8 - t * 12.0);
        disp += env * wave * 0.32 * (1.0 - t / 1.4);
      }
      pos.y = disp;
      vDisp = disp;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;
  var waterFrag = /* glsl */`
    uniform float uTime;
    varying float vDisp;
    void main() {
      // 水面颜色与夜空背景一致（#05070f），本身完全透明、无边框
      vec3 base = vec3(0.02, 0.03, 0.05);
      float glow = max(0.0, vDisp);
      // 仅涟漪隆起瞬间产生极低调微光，其余全透明 → 无颜色、无边框，倒影直接透出
      float vis = smoothstep(0.0, 0.08, glow);
      vec3 col = base + vec3(0.35, 0.38, 0.45) * glow * 0.35;
      float alpha = 0.5 * vis;
      gl_FragColor = vec4(col, alpha);
    }
  `;

  var waterGeo = new THREE.PlaneGeometry(96, 40, 64, 28);
  waterGeo.rotateX(-Math.PI / 2);       // 变为水平 XZ 平面，y=0
  var waterMat = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    vertexShader: waterVert,
    fragmentShader: waterFrag,
    side: THREE.FrontSide,
    transparent: true,
    depthWrite: false
  });
  var water = new THREE.Mesh(waterGeo, waterMat);
  water.position.y = 0;
  scene.add(water);

  /* ===== Bloom 后处理 ===== */
  var composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  var bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    isMobile ? 0.35 : 0.6,   // strength
    0.6,                       // radius
    0.18                       // threshold
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ===== 时间 / 动画循环 ===== */
  var clock = new THREE.Clock();
  function frame() {
    var dt = clock.getDelta();
    var t = clock.elapsedTime;

    // 星空缓慢旋转（主星空 + 下方倒影同步）
    stars.rotation.y = t * 0.008;
    brightStars.rotation.y = t * 0.012;
    starsMirror.rotation.y = t * 0.008;
    brightMirror.rotation.y = t * 0.012;

    // 涟漪 uniform 更新
    waterUniforms.uTime.value = t;
    waterUniforms.uRippleCount.value = ripples.length;
    for (var i = 0; i < RIPPLE_UNIFORMS; i++) {
      if (i < ripples.length) {
        uniformRipples[i].set(ripples[i].x, ripples[i].z, ripples[i].t);
      } else {
        uniformRipples[i].set(0, 0, -1000);
      }
    }

    // 雨滴更新
    for (var j = drops.length - 1; j >= 0; j--) {
      var d = drops[j];
      d.vy += d.gravity * dt;              // 重力加速
      d.y -= d.vy * dt;
      if (d.y <= 0) {                       // 没入水面：泛起涟漪并消失
        ripples.push({ x: d.x, z: d.z, t: t });
        if (ripples.length > RIPPLE_MAX) ripples.shift();
        killDrop(d);
        drops.splice(j, 1);
        continue;
      }
      d.sprite.position.set(d.x, d.y, d.z);

      // 残影拖尾采样（降频以省 draw call）
      if (t - d.nextGhost > 0.09) {
        d.nextGhost = t;
        addGhost(d, t);
      }
    }

    // 残影 ghost 衰减
    for (var k = ghosts.length - 1; k >= 0; k--) {
      var g = ghosts[k];
      var age = (t - g.born) / g.life;
      if (age >= 1) {
        removeSprite(g.sprite);
        ghosts.splice(k, 1);
      } else {
        g.sprite.material.opacity = g.base * (1 - age);
      }
    }

    composer.render();
    if (!reduceMotion) requestAnimationFrame(frame);
  }

  if (reduceMotion) {
    composer.render();   // 减少动态：只渲染一帧静态（星空可见）
  } else {
    requestAnimationFrame(frame);
  }

  /* ===== 工具 ===== */
  function rand(min, max) { return min + Math.random() * (max - min); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function timestamp() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }
  function saveToTxt() {
    var text = editor.value;
    if (!text.trim()) { showToast('输入为空，先写点字再保存'); return; }
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '文字雨_' + timestamp() + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast('已保存：' + a.download);
  }

  /* ===== 交互：输入即触发（中英文） + Ctrl+S 保存 ===== */
  editor.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      saveToTxt();
    }
  });

  var lastValue = editor.value;
  editor.addEventListener('compositionend', function () {
    var v = editor.value;
    if (!reduceMotion && v.length > lastValue.length) spawnLine(v.slice(lastValue.length));
    lastValue = v;
  });
  editor.addEventListener('input', function (e) {
    if (e.isComposing) return;             // 拼音编辑中：跳过，不更新基准值
    var data = e.data;
    if (!reduceMotion && data) spawnLine(data);
    lastValue = editor.value;
  });
})();
</script>
</body>
</html>
